  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap');
</style></defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#0B1220"/>

  <!-- Title -->
  <text x="40" y="52" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" letter-spacing="-1" fill="#F8FAFC">Terecode</text>
  <text x="40" y="70" font-family="'Inter', sans-serif" font-weight="400" font-size="11" letter-spacing="1.2" fill="#64748B">BRAND IDENTITY SYSTEM</text>

