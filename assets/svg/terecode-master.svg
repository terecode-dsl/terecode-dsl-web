  <text x="652" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Soft Gray</text>
  <rect x="696" y="284" width="64" height="40" rx="4" fill="#F8FAFC" stroke="#243050" stroke-width="1"/>
  <text x="728" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Off-white</text>
