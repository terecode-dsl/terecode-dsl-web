  <rect x="40" y="284" width="64" height="64" rx="6" fill="#1a2540"/>
  
  <rect x="43" y="287" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.38"/>
  <rect x="64" y="287" width="18" height="18" rx="2.5" fill="#2563EB"/>
  <rect x="85" y="287" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.38"/>
  <rect x="64" y="308" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.65"/>
  <rect x="64" y="329" width="18" height="18" rx="2.5" fill="#14B8A6" opacity="0.75"/>
