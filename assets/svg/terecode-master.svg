    <rect x="224" y="154" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.65"/>
    <rect x="224" y="175" width="18" height="18" rx="2.5" fill="#14B8A6" opacity="0.75"/>
  <text x="278" y="162" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="-0.4" fill="#F8FAFC">Terecode</text>
  <text x="278" y="177" font-family="'Inter', sans-serif" font-weight="400" font-size="9" letter-spacing="1" fill="#64748B">CROSS-PLATFORM UI COMPILER</text>
  <text x="340" y="228" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" letter-spacing="0.5">lockup-horizontal-dark</text>

  <!-- Horizontal lockup — light -->
  <rect x="540" y="110" width="220" height="100" rx="8" fill="#F8FAFC"/>
  
  <rect x="23" y="3" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.38"/>
  <rect x="44" y="3" width="18" height="18" rx="2.5" fill="#2563EB"/>
  <rect x="65" y="3" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.38"/>
  <rect x="44" y="24" width="18" height="18" rx="2.5" fill="#2563EB" opacity="0.65"/>
  <rect x="44" y="45" width="18" height="18" rx="2.5" fill="#14B8A6" opacity="0.75"/>
  <rect x="556" y="113" width="64" height="64" rx="0" fill="none"/>
  <text x="634" y="153" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="-0.3" fill="#0B1220">Terecode</text>
  <text x="634" y="168" font-family="'Inter', sans-serif" font-weight="400" font-size="9" letter-spacing="0.8" fill="#64748B">UI COMPILER</text>
  <text x="650" y="228" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" letter-spacing="0.5">lockup-horizontal</text>

