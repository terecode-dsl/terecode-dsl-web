  <rect x="240" y="284" width="64" height="40" rx="4" fill="#0B1220" stroke="#243050" stroke-width="0"/>
  <text x="272" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Deep Ink</text>
  <rect x="316" y="284" width="64" height="40" rx="4" fill="#2563EB" stroke="#243050" stroke-width="0"/>
  <text x="348" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Dev Blue</text>
  <rect x="392" y="284" width="64" height="40" rx="4" fill="#4F46E5" stroke="#243050" stroke-width="0"/>
